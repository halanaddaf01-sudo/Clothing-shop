<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر الملابس</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --surface:#f3f4f6;
  --ink:#17181c;
  --muted:#6b7078;
  --line:#e6e8ec;
  --accent:#e8336d;
  --accent-ink:#ffffff;
  --ok:#1f7a5a;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:999px;position:relative}
.icon-btn:active{background:var(--surface)}
.brand{flex:1;font-weight:800;font-size:20px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute;top:2px;inset-inline-start:2px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.badge[hidden]{display:none}
.badge.pop{animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.35)}}

.chips{display:flex;gap:8px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 16px;border-radius:999px;background:var(--surface);font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}

/* owner bar */
.owner-bar{display:flex;gap:8px;padding:12px;background:#fff6f9;border-bottom:1px solid #f6d3df;flex-wrap:wrap;align-items:center}
.owner-bar span{font-weight:700;color:var(--accent);margin-inline-end:auto}
.owner-bar[hidden]{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:700;background:var(--ink);color:#fff}
.btn.accent{background:var(--accent)}
.btn.ok{background:var(--ok)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.block{width:100%;padding:13px}
.btn.small{padding:6px 12px;font-size:13px}

/* grid */
main{padding:14px 12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.section-head h2{font-size:20px;font-weight:800}
.section-head small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(5,1fr)}main{max-width:1100px;margin:0 auto}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.pic{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--surface)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .tools{position:absolute;top:6px;inset-inline-start:6px;display:flex;gap:6px}
.tool{width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.card .name{font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:800;font-size:17px;color:var(--accent)}
.add{width:38px;height:38px;border-radius:999px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.add:active{transform:scale(.92)}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty p{margin-bottom:14px}

/* drawer + sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(86vw,340px);background:var(--bg);z-index:40;transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:18px}
.drawer .list{flex:1;overflow-y:auto;padding:8px}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;padding:12px;border-radius:var(--r);text-align:start}
.menu-item .label{flex:1;font-weight:500}
.menu-item .count{color:var(--muted);font-size:13px}
.menu-item[aria-current="true"]{background:var(--surface);font-weight:700}
.drawer footer{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.switch input{appearance:none;width:46px;height:26px;border-radius:999px;background:#cfd3d9;position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:999px;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(-20px)}

.sheet{position:fixed;inset-inline:0;bottom:0;max-height:92vh;background:var(--bg);z-index:40;border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .26s ease;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:18px}
.sheet .body{overflow-y:auto;padding:12px 16px;display:grid;gap:12px}
.line-item{display:flex;gap:12px;align-items:center}
.line-item img{width:62px;height:82px;object-fit:cover;border-radius:8px;background:var(--surface);flex:none}
.line-item .info{flex:1;min-width:0}
.line-item .info b{display:block;font-weight:500;font-size:14px}
.line-item .info span{color:var(--accent);font-weight:800}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px}
.stepper button{width:32px;height:32px;display:grid;place-items:center;font-size:18px;font-weight:700}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.sum{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding-top:10px;border-top:1px dashed var(--line)}
.fields{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.field textarea{resize:vertical;min-height:64px}
.actions{display:grid;gap:8px}

/* modal */
dialog{border:0;border-radius:16px;padding:0;width:min(92vw,420px);margin:auto;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(10,10,14,.5)}
.modal{padding:18px;display:grid;gap:14px}
.modal h3{font-size:18px;font-weight:800}
.modal .btns{display:flex;gap:8px}
.modal .btns .btn{flex:1}
.pick{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center}
.pick .prev{width:90px;aspect-ratio:3/4;border-radius:8px;background:var(--surface);overflow:hidden}
.pick .prev img{width:100%;height:100%;object-fit:cover}
.note{font-size:13px;color:var(--muted)}
code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:13px;direction:ltr;unicode-bidi:embed}

.toast{position:fixed;bottom:22px;inset-inline:0;margin:0 auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="bar">
    <button class="icon-btn" data-a="open-drawer" aria-label="القائمة">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand" id="brand"></div>
    <button class="icon-btn" data-a="open-cart" aria-label="السلة">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.2"/><circle cx="17" cy="20.5" r="1.2"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="owner-bar" id="ownerBar" hidden>
  <span>وضع المالك</span>
  <button class="btn small accent" data-a="add-prod">+ منتج</button>
  <button class="btn small" data-a="add-cat">+ فئة</button>
</div>

<main>
  <div class="section-head"><h2 id="secTitle"></h2><small id="secCount"></small></div>
  <div class="grid" id="grid"></div>
</main>

<div class="scrim" id="scrim" data-a="close-all"></div>

<aside class="drawer" id="drawer" aria-label="القائمة">
  <header><span>الفئات</span><button class="icon-btn" data-a="close-all" aria-label="إغلاق">✕</button></header>
  <div class="list" id="menuList"></div>
  <footer>
    <label class="switch"><span>وضع المالك</span><input type="checkbox" id="ownerSwitch" data-a="toggle-owner"></label>
    <button class="btn ghost" id="settingsBtn" data-a="settings" hidden>إعدادات المتجر</button>
    <button class="btn ghost" id="logoutBtn" data-a="logout" hidden>تسجيل خروج المالك</button>
  </footer>
</aside>

<section class="sheet" id="cartSheet" aria-label="السلة">
  <header><span>سلة الطلبات</span><button class="icon-btn" data-a="close-all" aria-label="إغلاق">✕</button></header>
  <div class="body" id="cartBody"></div>
</section>

<dialog id="modal"><div class="modal" id="modalBody"></div></dialog>
<div class="toast" id="toast"></div>

<script type="module">
let initializeApp, getFirestore, collection, doc, onSnapshot, addDoc, setDoc, deleteDoc, writeBatch,
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut;

/* =====================================================
   إعدادات Firebase — الصق هون القيم من لوحة Firebase
   (Project settings ← Your apps ← Web app ← firebaseConfig)
   ===================================================== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
const configured = !Object.values(firebaseConfig).some(v => String(v).startsWith('YOUR_'));

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const palette = ['#f2d7d9','#d6e4e1','#e3ddf0','#f4e3c8','#d5e1f2','#e6ebc9'];
function ph(i){
  const c = palette[Math.abs(i) % palette.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect width="300" height="400" fill="${c}"/><g fill="none" stroke="#000" stroke-opacity=".3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M150 150a14 14 0 1 1 14 14c-8 3-14 8-14 16v6"/><path d="M150 186L82 232a10 10 0 0 0 6 18h124a10 10 0 0 0 6-18z"/></g></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* ---------- state ---------- */
const S = {
  store: { name: 'متجري', phone: '', currency: '$' },
  cats: [],
  products: [],
  cart: {},
  customer: { name: '', phone: '', address: '', note: '' },
  owner: false,
  user: null,
  cur: 'all',
  loading: true,
  error: false
};

/* السلة وبيانات الزبون بتنحفظ على جهاز الزبون فقط */
const LS = 'clothing-cart-v2';
try { const d = JSON.parse(localStorage.getItem(LS)); if (d) { S.cart = d.cart || {}; S.customer = { ...S.customer, ...(d.customer||{}) }; } } catch(e){}
const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify({ cart: S.cart, customer: S.customer })); } catch(e){} };

/* ---------- firebase ---------- */
let db, auth;
async function startFirebase(){
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [A, F, U] = await Promise.all([
      import(base + 'firebase-app.js'),
      import(base + 'firebase-firestore.js'),
      import(base + 'firebase-auth.js')
    ]);
    ({ initializeApp } = A);
    ({ getFirestore, collection, doc, onSnapshot, addDoc, setDoc, deleteDoc, writeBatch } = F);
    ({ getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } = U);
  } catch(e){
    console.error(e);
    S.loading = false; S.error = true; render();
    return;
  }
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);

  const fail = e => { console.error(e); S.loading = false; S.error = true; render(); };

  onSnapshot(doc(db, 'store', 'settings'), snap => {
    if (snap.exists()) Object.assign(S.store, snap.data());
    render();
  }, fail);

  onSnapshot(collection(db, 'categories'), snap => {
    S.cats = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.t||0) - (b.t||0));
    render();
  }, fail);

  onSnapshot(collection(db, 'products'), snap => {
    S.error = false;
    S.products = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.t||0) - (b.t||0));
    Object.keys(S.cart).forEach(id => { if (!S.products.find(p => p.id === id)) delete S.cart[id]; });
    S.loading = false;
    saveLocal(); render();
  }, fail);

  onAuthStateChanged(auth, u => { S.user = u; if (!u) S.owner = false; render(); });
}

async function run(fn){
  try { await fn(); return true; }
  catch(e){
    console.error(e);
    toast(e.code === 'permission-denied' ? 'ما عندك صلاحية، سجّل دخول المالك' : 'صار خطأ، جرّب مرة ثانية');
    return false;
  }
}

/* ---------- utils ---------- */
const money = n => Number(n).toLocaleString('en-US', {maximumFractionDigits:2}) + ' ' + S.store.currency;
const cartCount = () => Object.values(S.cart).reduce((a,b)=>a+b,0);
const cartTotal = () => Object.entries(S.cart).reduce((t,[id,q])=>{ const p=S.products.find(x=>x.id===id); return t + (p?p.price*q:0); },0);
const imgOf = p => p.img || ph(S.products.indexOf(p));
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400); }

/* ---------- render ---------- */
function render(){
  $('#brand').textContent = S.store.name;
  document.title = S.store.name;
  if (S.cur !== 'all' && !S.cats.find(c=>c.id===S.cur)) S.cur = 'all';

  $('#chips').innerHTML =
    `<button class="chip" data-a="cat" data-id="all" aria-pressed="${S.cur==='all'}">الكل</button>` +
    S.cats.map(c=>`<button class="chip" data-a="cat" data-id="${c.id}" aria-pressed="${S.cur===c.id}">${esc(c.name)}</button>`).join('');

  const list = S.cur==='all' ? S.products : S.products.filter(p=>p.cat===S.cur);
  const catName = S.cur==='all' ? 'كل المنتجات' : S.cats.find(c=>c.id===S.cur).name;
  $('#secTitle').textContent = catName;
  $('#secCount').textContent = S.loading ? '' : list.length + ' منتج';

  if (!configured) {
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">
      <p><b>التطبيق ما انربط بقاعدة البيانات بعد.</b></p>
      <p>افتح الملف وعبّي القيم داخل <code>firebaseConfig</code> بأول السكربت.</p></div>`;
  } else if (S.error) {
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">
      <p><b>تعذّر الاتصال بقاعدة البيانات.</b></p>
      <p>تأكد من الإنترنت، ومن قيم firebaseConfig، ومن إنشاء Firestore، وافتح الرابط من متصفح عادي.</p>
      <button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>`;
  } else if (S.loading) {
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><p>جاري التحميل...</p></div>`;
  } else if (!list.length) {
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">
      <p>ما في منتجات بهالفئة حالياً</p>
      ${S.owner ? '<button class="btn accent" data-a="add-prod">+ أضف أول منتج</button>' : ''}</div>`;
  } else {
    $('#grid').innerHTML = list.map(p=>`
      <article class="card">
        <div class="pic">
          <img src="${imgOf(p)}" alt="${esc(p.name)}" loading="lazy">
          ${S.owner ? `<div class="tools">
            <button class="tool" data-a="edit-prod" data-id="${p.id}" aria-label="تعديل">✎</button>
            <button class="tool" data-a="del-prod" data-id="${p.id}" aria-label="حذف">🗑</button>
          </div>` : ''}
        </div>
        <div class="name">${esc(p.name)}</div>
        <div class="row">
          <span class="price">${money(p.price)}</span>
          <button class="add" data-a="add-cart" data-id="${p.id}" aria-label="أضف إلى السلة">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </article>`).join('');
  }

  $('#ownerBar').hidden = !S.owner;
  $('#settingsBtn').hidden = !S.owner;
  $('#logoutBtn').hidden = !S.user;
  $('#ownerSwitch').checked = S.owner;

  renderMenu();
  renderBadge();
  if ($('#cartSheet').classList.contains('on')) renderCart();
}

function renderMenu(){
  const count = id => id==='all' ? S.products.length : S.products.filter(p=>p.cat===id).length;
  $('#menuList').innerHTML =
    `<button class="menu-item" data-a="cat" data-id="all" aria-current="${S.cur==='all'}"><span class="label">كل المنتجات</span><span class="count">${count('all')}</span></button>` +
    S.cats.map(c=>`
      <div class="menu-item" aria-current="${S.cur===c.id}" style="padding:0">
        <button class="menu-item" style="flex:1" data-a="cat" data-id="${c.id}"><span class="label">${esc(c.name)}</span><span class="count">${count(c.id)}</span></button>
        ${S.owner ? `<button class="tool" style="background:var(--surface);box-shadow:none" data-a="edit-cat" data-id="${c.id}" aria-label="تعديل">✎</button>
        <button class="tool" style="background:var(--surface);box-shadow:none;margin-inline-end:6px" data-a="del-cat" data-id="${c.id}" aria-label="حذف">🗑</button>` : ''}
      </div>`).join('') +
    (S.owner ? `<button class="btn accent block" style="margin-top:10px" data-a="add-cat">+ إضافة فئة</button>` : '');
}

function renderBadge(){
  const n = cartCount(), b = $('#badge');
  b.hidden = n===0; b.textContent = n;
}

function renderCart(){
  const items = Object.entries(S.cart).map(([id,q])=>({p:S.products.find(x=>x.id===id),q})).filter(x=>x.p);
  const body = $('#cartBody');
  if (!items.length){
    body.innerHTML = `<div class="empty"><p>السلة فاضية</p><button class="btn" data-a="close-all">تابع التسوق</button></div>`;
    return;
  }
  const c = S.customer;
  body.innerHTML = items.map(({p,q})=>`
    <div class="line-item">
      <img src="${imgOf(p)}" alt="">
      <div class="info"><b>${esc(p.name)}</b><span>${money(p.price*q)}</span></div>
      <div class="stepper">
        <button data-a="inc" data-id="${p.id}" aria-label="زيادة">+</button>
        <span>${q}</span>
        <button data-a="dec" data-id="${p.id}" aria-label="نقصان">−</button>
      </div>
    </div>`).join('') + `
    <div class="sum"><span>المجموع</span><span>${money(cartTotal())}</span></div>
    <div class="fields">
      <div class="field"><label for="cName">الاسم *</label><input id="cName" data-f="name" value="${esc(c.name)}" autocomplete="name"></div>
      <div class="field"><label for="cPhone">رقم الهاتف</label><input id="cPhone" data-f="phone" value="${esc(c.phone)}" inputmode="tel" autocomplete="tel"></div>
      <div class="field"><label for="cAddr">العنوان</label><input id="cAddr" data-f="address" value="${esc(c.address)}" autocomplete="street-address"></div>
      <div class="field"><label for="cNote">ملاحظات (المقاس، اللون...)</label><textarea id="cNote" data-f="note">${esc(c.note)}</textarea></div>
    </div>
    <div class="actions">
      <button class="btn ok block" data-a="send">إرسال الطلب عبر واتساب</button>
      <button class="btn ghost block" data-a="copy">نسخ الطلب</button>
      <button class="btn ghost block" data-a="clear-cart">تفريغ السلة</button>
    </div>`;
}

/* ---------- panels ---------- */
function closeAll(){
  $('#drawer').classList.remove('on');
  $('#cartSheet').classList.remove('on');
  $('#scrim').classList.remove('on');
}
function openDrawer(){ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); }
function openCart(){ renderCart(); $('#cartSheet').classList.add('on'); $('#scrim').classList.add('on'); }

/* ---------- modal ---------- */
const modal = $('#modal');
function showModal(html){ $('#modalBody').innerHTML = html; if(!modal.open) modal.showModal(); }
function closeModal(){ if(modal.open) modal.close(); }

function confirmModal(text, onYes){
  showModal(`<h3>${esc(text)}</h3>
    <div class="btns"><button class="btn ghost" data-a="modal-close">إلغاء</button><button class="btn accent" id="yes">حذف</button></div>`);
  $('#yes').onclick = () => { closeModal(); onYes(); };
}

function loginModal(){
  if (!configured) return toast('اربط Firebase أولاً');
  showModal(`<h3>دخول المالك</h3>
    <div class="field"><label for="lEmail">الإيميل</label><input id="lEmail" type="email" autocomplete="username" dir="ltr"></div>
    <div class="field"><label for="lPass">كلمة السر</label><input id="lPass" type="password" autocomplete="current-password" dir="ltr"></div>
    <div class="btns"><button class="btn ghost" data-a="modal-close">إلغاء</button><button class="btn accent" id="doLogin">دخول</button></div>`);
  $('#lEmail').focus();
  const go = async () => {
    const email = $('#lEmail').value.trim(), pass = $('#lPass').value;
    if (!email || !pass) return toast('اكتب الإيميل وكلمة السر');
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      S.owner = true; closeModal(); render(); toast('أهلاً، وضع المالك شغّال');
    } catch(e){ toast('الإيميل أو كلمة السر غلط'); }
  };
  $('#doLogin').onclick = go;
  $('#lPass').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function catModal(id){
  const c = id ? S.cats.find(x=>x.id===id) : null;
  showModal(`<h3>${c?'تعديل الفئة':'فئة جديدة'}</h3>
    <div class="field"><label for="catName">اسم الفئة</label><input id="catName" value="${esc(c?c.name:'')}" placeholder="مثال: جاكيتات"></div>
    <div class="btns"><button class="btn ghost" data-a="modal-close">إلغاء</button><button class="btn accent" id="saveCat">حفظ</button></div>`);
  $('#catName').focus();
  $('#saveCat').onclick = async () => {
    const name = $('#catName').value.trim();
    if (!name) return toast('اكتب اسم الفئة');
    closeModal();
    if (c) await run(() => setDoc(doc(db,'categories',c.id), { name, t: c.t || Date.now() }));
    else {
      let ref;
      const ok = await run(async () => { ref = await addDoc(collection(db,'categories'), { name, t: Date.now() }); });
      if (ok && ref) { S.cur = ref.id; render(); }
    }
  };
}

let tmpImg = null;
function prodModal(id){
  if (!S.cats.length) { toast('أضف فئة أولاً'); return catModal(); }
  const p = id ? S.products.find(x=>x.id===id) : null;
  tmpImg = p ? (p.img || null) : null;
  const defCat = p ? p.cat : (S.cur!=='all' ? S.cur : S.cats[0].id);
  showModal(`<h3>${p?'تعديل المنتج':'منتج جديد'}</h3>
    <div class="pick">
      <div class="prev" id="prev"><img src="${tmpImg || ph(S.products.length)}" alt=""></div>
      <div style="display:grid;gap:6px">
        <label class="btn ghost small" style="cursor:pointer">اختر صورة<input type="file" id="file" accept="image/*" hidden></label>
        <span class="note">الصورة بتتصغّر تلقائياً</span>
      </div>
    </div>
    <div class="field"><label for="pName">اسم المنتج</label><input id="pName" value="${esc(p?p.name:'')}"></div>
    <div class="field"><label for="pPrice">السعر (${esc(S.store.currency)})</label><input id="pPrice" inputmode="decimal" value="${p?p.price:''}"></div>
    <div class="field"><label for="pCat">الفئة</label><select id="pCat">${S.cats.map(c=>`<option value="${c.id}" ${c.id===defCat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="btns"><button class="btn ghost" data-a="modal-close">إلغاء</button><button class="btn accent" id="saveProd">حفظ</button></div>`);
  $('#file').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try { tmpImg = await shrink(f, 600); $('#prev').innerHTML = `<img src="${tmpImg}" alt="">`; }
    catch(err){ toast('تعذّر قراءة الصورة'); }
  };
  $('#saveProd').onclick = async () => {
    const name = $('#pName').value.trim();
    const price = parseFloat(String($('#pPrice').value).replace(',', '.'));
    if (!name) return toast('اكتب اسم المنتج');
    if (!(price >= 0)) return toast('اكتب السعر');
    if (tmpImg && tmpImg.length > 900000) return toast('الصورة كبيرة، جرّب صورة ثانية');
    const cat = $('#pCat').value;
    const data = { name, price, cat, img: tmpImg || null, t: p ? (p.t || Date.now()) : Date.now() };
    closeModal();
    S.cur = cat;
    await run(() => p ? setDoc(doc(db,'products',p.id), data) : addDoc(collection(db,'products'), data));
    render();
  };
}

function shrink(file, max){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.7));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function settingsModal(){
  showModal(`<h3>إعدادات المتجر</h3>
    <div class="field"><label for="sName">اسم المتجر</label><input id="sName" value="${esc(S.store.name)}"></div>
    <div class="field"><label for="sPhone">رقم واتساب المالك (مع رمز الدولة)</label><input id="sPhone" inputmode="tel" placeholder="مثال: 963912345678" value="${esc(S.store.phone)}"></div>
    <div class="field"><label for="sCur">العملة</label><input id="sCur" value="${esc(S.store.currency)}"></div>
    <p class="note">الطلبات بتوصل على هالرقم عبر واتساب. اكتب الرقم بدون + أو أصفار بالبداية.</p>
    <div class="btns"><button class="btn ghost" data-a="modal-close">إلغاء</button><button class="btn accent" id="saveSet">حفظ</button></div>`);
  $('#saveSet').onclick = async () => {
    const data = {
      name: $('#sName').value.trim() || 'متجري',
      phone: $('#sPhone').value.replace(/\D/g,''),
      currency: $('#sCur').value.trim() || '$'
    };
    closeModal();
    await run(() => setDoc(doc(db,'store','settings'), data));
  };
}

/* ---------- order ---------- */
function orderText(){
  const items = Object.entries(S.cart).map(([id,q])=>({p:S.products.find(x=>x.id===id),q})).filter(x=>x.p);
  const c = S.customer;
  let t = `طلب جديد من ${S.store.name}\n\n`;
  items.forEach(({p,q},i)=>{ t += `${i+1}) ${p.name} × ${q} = ${money(p.price*q)}\n`; });
  t += `\nالمجموع: ${money(cartTotal())}\n\nالاسم: ${c.name}`;
  if (c.phone) t += `\nالهاتف: ${c.phone}`;
  if (c.address) t += `\nالعنوان: ${c.address}`;
  if (c.note) t += `\nملاحظات: ${c.note}`;
  return t;
}
function checkOrder(){
  if (!cartCount()) { toast('السلة فاضية'); return false; }
  if (!S.customer.name.trim()) { toast('اكتب اسمك أولاً'); $('#cName')?.focus(); return false; }
  return true;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el || el.tagName==='INPUT') return;
  const a = el.dataset.a, id = el.dataset.id;
  switch(a){
    case 'open-drawer': openDrawer(); break;
    case 'close-all': closeAll(); break;
    case 'open-cart': openCart(); break;
    case 'modal-close': closeModal(); break;
    case 'cat': S.cur = id; closeAll(); render(); window.scrollTo({top:0}); break;
    case 'add-cat': closeAll(); catModal(); break;
    case 'edit-cat': closeAll(); catModal(id); break;
    case 'del-cat': {
      const n = S.products.filter(p=>p.cat===id).length;
      confirmModal(n ? `حذف الفئة و${n} منتج فيها؟` : 'حذف هالفئة؟', () => run(async () => {
        const b = writeBatch(db);
        S.products.filter(p=>p.cat===id).forEach(p => b.delete(doc(db,'products',p.id)));
        b.delete(doc(db,'categories',id));
        await b.commit();
      }));
      break;
    }
    case 'add-prod': closeAll(); prodModal(); break;
    case 'edit-prod': prodModal(id); break;
    case 'del-prod': confirmModal('حذف هالمنتج؟', () => run(() => deleteDoc(doc(db,'products',id)))); break;
    case 'add-cart': {
      S.cart[id] = (S.cart[id]||0) + 1; saveLocal(); renderBadge();
      const b=$('#badge'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
      toast('انضاف للسلة');
      break;
    }
    case 'inc': S.cart[id]++; saveLocal(); render(); break;
    case 'dec': if(--S.cart[id] <= 0) delete S.cart[id]; saveLocal(); render(); break;
    case 'clear-cart': S.cart = {}; saveLocal(); render(); break;
    case 'settings': closeAll(); settingsModal(); break;
    case 'logout': signOut(auth).then(() => { closeAll(); toast('تم تسجيل الخروج'); }); break;
    case 'send': {
      if (!checkOrder()) break;
      const num = (S.store.phone || '').replace(/\D/g,'');
      if (!num) { toast('رقم واتساب المتجر مو مضاف'); break; }
      window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(orderText()), '_blank');
      break;
    }
    case 'copy': {
      if (!checkOrder()) break;
      const t = orderText();
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
        .then(()=>toast('انسخ الطلب، ابعته للمتجر'))
        .catch(()=>{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('تم النسخ');}catch(_){toast('تعذّر النسخ');} ta.remove(); });
      break;
    }
  }
});
$('#ownerSwitch').addEventListener('change', e => {
  if (e.target.checked) {
    if (S.user) { S.owner = true; render(); toast('وضع المالك شغّال'); }
    else { e.target.checked = false; closeAll(); loginModal(); }
  } else { S.owner = false; render(); }
});
$('#cartBody').addEventListener('input', e => {
  const f = e.target.dataset.f; if(!f) return;
  S.customer[f] = e.target.value; saveLocal();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeAll(); });

render();
if (configured) startFirebase(); else { S.loading = false; render(); }
</script>
</body>
</html>
